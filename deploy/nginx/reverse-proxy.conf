server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Docker embedded DNS — re-resolve service names after rebuilds
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Health check for load balancers / orchestrators (no auth)
    location = /health {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $backend_upstream backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # If backend still emits Absolute/relative redirects, keep them under /api
        proxy_redirect ~^http://[^/]+/(.*)$ /api/$1;
        proxy_redirect / /api/;
    }
}
